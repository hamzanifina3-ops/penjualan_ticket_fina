<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eventify - Platform Penjualan Tiket Konser & Event</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f8f9fa;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .hero-section {
        background: linear-gradient(135deg, #0d6efd 0%, #0099ff 100%);
        color: white;
        border-radius: 1.5rem;
      }
      .card {
        border: none;
        border-radius: 1rem;
        transition: transform 0.2s;
      }
      .card:hover {
        transform: translateY(-3px);
      }
      .cursor-pointer {
        cursor: pointer;
      }
      .category-pill.active {
        background-color: #0d6efd !important;
        color: white !important;
        border-color: #0d6efd !important;
      }
    </style>
  </head>
  <body>
    <!-- Navbar -->
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm"
    >
      <div class="container">
        <a
          class="navbar-brand fw-bold text-primary"
          href="#"
          onclick="showPage('catalog')"
        >
          <i class="bi bi-ticket-perforated-fill me-2"></i>Eventify
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item">
              <a
                class="nav-link"
                href="#"
                onclick="showPage('catalog')"
                id="navCatalog"
                >Katalog Event</a
              >
            </li>
            <li class="nav-item" id="navHistoryContainer" style="display: none">
              <a
                class="nav-link"
                href="#"
                onclick="showPage('history')"
                id="navHistory"
                >Riwayat Pesanan</a
              >
            </li>
            <li class="nav-item ms-lg-3 mt-2 mt-lg-0" id="authNavArea"></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Main Container -->
    <div id="app" class="py-4"></div>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-4 mt-5">
      <div class="container">
        <p class="mb-0">
          &copy; 2026 Eventify Ticket Platform. Hak Cipta Dilindungi.
        </p>
      </div>
    </footer>

    <!-- Modal Auth -->
    <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 p-3 shadow">
          <div class="modal-header border-0">
            <h5 class="modal-title fw-bold" id="authModalTitle">
              Masuk ke Akun
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <div
              id="authErrorMsg"
              class="alert alert-danger py-2 mb-3 d-none"
              style="font-size: 0.9rem"
            ></div>
            <div id="registerFieldsContainer" style="display: none">
              <div class="mb-3">
                <label class="form-label fw-semibold">Nama Lengkap</label>
                <input
                  type="text"
                  id="regName"
                  class="form-control rounded-pill px-3"
                  placeholder="Nama Lengkap"
                />
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <input
                  type="email"
                  id="regEmail"
                  class="form-control rounded-pill px-3"
                  placeholder="email@domain.com"
                />
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold"
                  >Nomor Telepon / WhatsApp</label
                >
                <input
                  type="tel"
                  id="regPhone"
                  class="form-control rounded-pill px-3"
                  placeholder="08123456789"
                />
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Username</label>
              <input
                type="text"
                id="authUsername"
                class="form-control rounded-pill px-3"
                placeholder="Username"
              />
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Password</label>
              <input
                type="password"
                id="authPassword"
                class="form-control rounded-pill px-3"
                placeholder="Password"
              />
            </div>
            <button
              type="button"
              onclick="submitAuthForm()"
              class="btn btn-primary w-100 py-2 rounded-pill fw-bold shadow-sm"
              id="authSubmitBtn"
            >
              Masuk
            </button>
            <div class="text-center mt-3">
              <small class="text-muted" id="authSwitchText">
                Belum punya akun?
                <a
                  href="javascript:void(0);"
                  onclick="toggleAuthMode()"
                  class="text-primary fw-bold text-decoration-none"
                  >Daftar sekarang</a
                >
              </small>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Script -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const SCRIPT_URL =
        "https://script.google.com/macros/s/AKfycbxyCFnPq-B6DFKrAI0jzQE5EdFUlD_0130ed1-MXNkqtqmTp8HGSaR_y_1rvGLCFoqr/exec";

      let events = [];
      let users = JSON.parse(localStorage.getItem("eventify_users")) || [];
      let currentUser =
        JSON.parse(localStorage.getItem("eventify_current_user")) || null;
      let orders = JSON.parse(localStorage.getItem("eventify_orders")) || [];
      let currentSelectedEvent = null;
      let isRegisterMode = false;
      let bootstrapModalInstance = null;
      let activeCategoryFilter = "Semua";

      document.addEventListener("DOMContentLoaded", function () {
        bootstrapModalInstance = new bootstrap.Modal(
          document.getElementById("authModal"),
        );
        fetchAllDataFromSheet();
      });

      async function fetchAllDataFromSheet() {
        try {
          let response = await fetch(`${SCRIPT_URL}?action=get_all_data`);
          let result = await response.json();

          if (result.status === "success") {
            events = (result.events || []).map((ev) => ({
              id_event: ev.ID_EVENT,
              nama_event: ev.NAMA_EVENT,
              category: ev.KATEGORI || "Musik",
              tanggal: ev.TANGGAL,
              lokasi: ev.LOKASI,
              deskripsi: ev.DESKRIPSI,
              status: ev.STATUS,
              image:
                ev.IMAGE ||
                "https://images.unsplash.com/photo-1540039155733-5bb30b53aa14?auto=format&fit=crop&w=600&q=80",
              ticketCategories: (ev.ticketCategories || []).map((tkt) => ({
                id_ticket: tkt.ID_TIKET,
                id_event: tkt.ID_EVENT,
                nama_ticket: tkt.NAMA_TICKET,
                harga: Number(tkt.HARGA || 0),
                kuota: Number(tkt.KUOTA || 0),
                deskripsi: tkt.DESKRIPSI || "-",
                status: tkt.STATUS,
              })),
            }));

            // Menggabungkan data pesanan dari Sheet dengan pesanan lokal agar riwayat tidak hilang
            if (result.orders) {
              const sheetOrders = result.orders.map((ord) => ({
                id_pesanan: ord.ID_PESANAN,
                id_ticket: ord.ID_TIKET,
                nama_pemesan: ord.NAMA_PEMESAN,
                email: ord.EMAIL,
                no_hp: ord.NO_HP,
                jumlah: Number(ord.JUMLAH || 1),
                total_harga: Number(ord.TOTAL_HARGA || 0),
                tanggal_pesan: ord.TANGGAL_PESAN,
                status: ord.STATUS,
                eventTitle: ord.eventTitle || "Eventify Concert",
                buyerUsername: ord.buyerUsername || ord.EMAIL || "",
                categoryName: ord.categoryName || "Regular",
                paymentMethod: ord.paymentMethod || "Transfer Bank",
                qrCodeString: ord.qrCodeString || "TICKET-" + ord.ID_PESANAN,
              }));

              // Menyatu dan membuang duplikasi berdasarkan ID Pesanan
              const mergedOrdersMap = new Map();
              orders
                .concat(sheetOrders)
                .forEach((o) => mergedOrdersMap.set(o.id_pesanan, o));
              orders = Array.from(mergedOrdersMap.values());
              localStorage.setItem("eventify_orders", JSON.stringify(orders));
            }
          }
        } catch (error) {
          console.error("Gagal mengambil data dari server:", error);
        }
        updateAuthNav();
        showPage("catalog");
      }

      function showPage(pageId, param = null) {
        const app = document.getElementById("app");
        updateAuthNav();
        document
          .querySelectorAll(".navbar-nav .nav-link")
          .forEach((el) => el.classList.remove("active"));

        if (pageId === "catalog") {
          if (document.getElementById("navCatalog"))
            document.getElementById("navCatalog").classList.add("active");
          app.innerHTML = renderCatalog();
        } else if (pageId === "history") {
          if (document.getElementById("navHistory"))
            document.getElementById("navHistory").classList.add("active");
          app.innerHTML = renderOrderHistory();
        } else if (pageId === "detail") {
          currentSelectedEvent = events.find(
            (e) => String(e.id_event).trim() === String(param).trim(),
          );
          app.innerHTML = renderDetail(currentSelectedEvent);
        } else if (pageId === "checkout") {
          app.innerHTML = renderCheckout(currentSelectedEvent, param);
        }
        window.scrollTo(0, 0);
      }

      function updateAuthNav() {
        const navArea = document.getElementById("authNavArea");
        const historyContainer = document.getElementById("navHistoryContainer");
        if (!navArea) return;

        if (currentUser) {
          if (historyContainer) historyContainer.style.display = "block";
          navArea.innerHTML = `
            <div class="dropdown">
                <button class="btn btn-outline-light dropdown-toggle rounded-pill px-3" type="button" data-bs-toggle="dropdown">
                  <i class="bi bi-person-circle me-1"></i> ${currentUser.name}
                </button>
                <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-3">
                    <li><h6 class="dropdown-header">Akun: @${currentUser.username}</h6></li>
                    <li><a class="dropdown-item" href="javascript:void(0);" onclick="showPage('history')"><i class="bi bi-ticket-detailed me-2"></i>Riwayat Pesanan</a></li>
                    <li><hr class="dropdown-divider"></li>
                    <li><a class="dropdown-item text-danger" href="javascript:void(0);" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i>Keluar</a></li>
                </ul>
            </div>`;
        } else {
          if (historyContainer) historyContainer.style.display = "none";
          navArea.innerHTML = `<button class="btn btn-primary rounded-pill px-4 fw-semibold shadow-sm" onclick="openAuthModal('login')">Masuk / Daftar</button>`;
        }
      }

      function openAuthModal(mode) {
        isRegisterMode = mode === "register";
        document.getElementById("authModalTitle").innerText = isRegisterMode
          ? "Daftar Akun Baru"
          : "Masuk ke Akun";
        document.getElementById("registerFieldsContainer").style.display =
          isRegisterMode ? "block" : "none";
        document.getElementById("authSubmitBtn").innerText = isRegisterMode
          ? "Daftar Sekarang"
          : "Masuk";
        document.getElementById("authSwitchText").innerHTML = isRegisterMode
          ? `Sudah punya akun? <a href="javascript:void(0);" onclick="toggleAuthMode()" class="text-primary fw-bold text-decoration-none">Masuk di sini</a>`
          : `Belum punya akun? <a href="javascript:void(0);" onclick="toggleAuthMode()" class="text-primary fw-bold text-decoration-none">Daftar sekarang</a>`;
        if (bootstrapModalInstance) bootstrapModalInstance.show();
      }

      function toggleAuthMode() {
        isRegisterMode = !isRegisterMode;
        openAuthModal(isRegisterMode ? "register" : "login");
      }

      function submitAuthForm() {
        const usernameInput = document
          .getElementById("authUsername")
          .value.trim();
        const passwordInput = document.getElementById("authPassword").value;

        if (!usernameInput || !passwordInput) {
          document.getElementById("authErrorMsg").innerText =
            "Username dan password wajib diisi!";
          document.getElementById("authErrorMsg").classList.remove("d-none");
          return;
        }

        if (isRegisterMode) {
          currentUser = {
            name:
              document.getElementById("regName").value.trim() || usernameInput,
            email:
              document.getElementById("regEmail").value.trim() ||
              usernameInput + "@mail.com",
            phone:
              document.getElementById("regPhone").value.trim() || "08123456789",
            username: usernameInput,
            password: passwordInput,
          };
          users.push(currentUser);
          localStorage.setItem("eventify_users", JSON.stringify(users));
          localStorage.setItem(
            "eventify_current_user",
            JSON.stringify(currentUser),
          );
          alert("Pendaftaran berhasil!");
        } else {
          const found = users.find(
            (u) => u.username.toLowerCase() === usernameInput.toLowerCase(),
          );
          currentUser = found || {
            name: usernameInput,
            email: usernameInput + "@mail.com",
            phone: "08123456789",
            username: usernameInput,
          };
          localStorage.setItem(
            "eventify_current_user",
            JSON.stringify(currentUser),
          );
          alert(`Selamat datang kembali, ${currentUser.name}!`);
        }

        if (bootstrapModalInstance) bootstrapModalInstance.hide();
        updateAuthNav();
        showPage("catalog");
      }

      function logout() {
        currentUser = null;
        localStorage.removeItem("eventify_current_user");
        updateAuthNav();
        showPage("catalog");
        alert("Berhasil keluar.");
      }

      function renderCatalog() {
        const categories = ["Semua", "Musik", "Seminar", "Olahraga"];
        return `
            <div class="container">
                <div class="hero-section p-5 mb-4 shadow-sm text-center">
                    <h1 class="display-5 fw-bold mb-3">Temukan Pengalaman Konser & Event Terbaik</h1>
                    <p class="lead opacity-75 mb-4">Pesan tiket event favoritmu dengan mudah, cepat, dan aman.</p>
                    <div class="row justify-content-center">
                        <div class="col-md-6">
                            <input type="text" id="searchInput" class="form-control form-control-lg rounded-pill px-4 shadow-sm" placeholder="Cari nama event atau lokasi..." onkeyup="filterEvents()">
                        </div>
                    </div>
                </div>
                <div class="d-flex justify-content-center gap-2 mb-4 flex-wrap">
                    ${categories.map((cat) => `<button onclick="filterByCategory('${cat}')" class="btn btn-outline-primary rounded-pill px-4 py-2 fw-semibold category-pill ${activeCategoryFilter === cat ? "active" : ""}">${cat}</button>`).join("")}
                </div>
                <div class="row g-4" id="eventListContainer">${renderEventCards(events)}</div>
            </div>`;
      }

      function renderEventCards(eventList) {
        if (eventList.length === 0)
          return `<div class="text-center py-5 text-muted"><p>Tidak ada event yang ditemukan.</p></div>`;
        return eventList
          .map(
            (event) => `
            <div class="col-md-4 event-card-item" data-title="${event.nama_event.toLowerCase()}" data-location="${event.lokasi.toLowerCase()}" data-category="${event.category}">
                <div class="card h-100 shadow-sm rounded-4 overflow-hidden">
                    <img src="${event.image}" class="card-img-top" style="height: 200px; object-fit: cover;" alt="${event.nama_event}">
                    <div class="card-body d-flex flex-column">
                        <span class="badge bg-primary-subtle text-primary align-self-start mb-2 px-3 py-2 rounded-pill fw-semibold">${event.category}</span>
                        <h5 class="card-title fw-bold">${event.nama_event}</h5>
                        <p class="text-muted small mb-1"><i class="bi bi-calendar-event me-2"></i>${event.tanggal ? String(event.tanggal).split("T")[0] : "-"}</p>
                        <p class="text-muted small mb-3"><i class="bi bi-geo-alt me-2"></i>${event.lokasi}</p>
                        <button onclick="showPage('detail', '${event.id_event}')" class="mt-auto btn btn-outline-primary rounded-pill fw-semibold">Lihat Detail & Pesan</button>
                    </div>
                </div>
            </div>`,
          )
          .join("");
      }

      function filterByCategory(cat) {
        activeCategoryFilter = cat;
        document
          .querySelectorAll(".category-pill")
          .forEach((b) =>
            b.innerText.trim() === cat
              ? b.classList.add("active")
              : b.classList.remove("active"),
          );
        filterEvents();
      }

      function filterEvents() {
        const query = document.getElementById("searchInput")
          ? document.getElementById("searchInput").value.toLowerCase()
          : "";
        document.querySelectorAll(".event-card-item").forEach((item) => {
          const matchQ =
            item.dataset.title.includes(query) ||
            item.dataset.location.includes(query);
          const matchC =
            activeCategoryFilter === "Semua" ||
            item.dataset.category === activeCategoryFilter;
          item.style.display = matchQ && matchC ? "block" : "none";
        });
      }

      function renderDetail(event) {
        if (!event)
          return `<div class="container text-center py-5"><h3>Event tidak ditemukan</h3><button onclick="showPage('catalog')" class="btn btn-primary mt-3 rounded-pill">Kembali</button></div>`;
        return `
            <div class="container" style="max-width: 800px;">
                <button onclick="showPage('catalog')" class="btn btn-link text-decoration-none mb-3 p-0"><i class="bi bi-arrow-left me-1"></i> Kembali ke Katalog</button>
                <div class="card shadow-sm rounded-4 p-4 p-md-5">
                    <img src="${event.image}" class="img-fluid rounded-4 mb-4 shadow-sm" style="max-height: 350px; width: 100%; object-fit: cover;" alt="${event.nama_event}">
                    <span class="badge bg-primary-subtle text-primary align-self-start mb-2 px-3 py-2 rounded-pill fw-semibold">${event.category}</span>
                    <h1 class="fw-bold mb-3">${event.nama_event}</h1>
                    <p class="text-muted mb-2"><i class="bi bi-calendar-event me-2"></i><strong>Tanggal:</strong> ${event.tanggal ? String(event.tanggal).split("T")[0] : "-"}</p>
                    <p class="text-muted mb-3"><i class="bi bi-geo-alt me-2"></i><strong>Lokasi:</strong> ${event.lokasi}</p>
                    <div class="p-3 bg-light rounded-4 mb-4"><p class="text-muted mb-0">${event.deskripsi || "-"}</p></div>
                    <h4 class="fw-bold mb-3">Pilihan Kategori Tiket Tersedia</h4>
                    <div class="row g-3 mb-4">
                        ${(event.ticketCategories || [])
                          .map(
                            (cat) => `
                            <div class="col-md-6">
                                <div class="p-3 border rounded-4 bg-light h-100">
                                    <h5 class="fw-bold text-primary mb-1">${cat.nama_ticket}</h5>
                                    <p class="mb-2 fw-bold text-dark fs-5">Rp ${cat.harga.toLocaleString()}</p>
                                    <span class="badge ${cat.kuota > 0 ? "bg-success-subtle text-success" : "bg-danger-subtle text-danger"}">Sisa: ${cat.kuota} Tiket</span>
                                </div>
                            </div>`,
                          )
                          .join("")}
                    </div>
                    <button onclick="handleOrderClick('${event.id_event}')" class="btn btn-primary w-100 py-3 rounded-pill fw-bold shadow-sm">Pesan Kategori Tiket</button>
                </div>
            </div>`;
      }

      function handleOrderClick(eventId) {
        if (!currentUser) {
          alert("Anda harus login terlebih dahulu!");
          openAuthModal("login");
          return;
        }
        showPage("checkout", eventId);
      }

      function renderCheckout(event) {
        if (
          !event ||
          !event.ticketCategories ||
          event.ticketCategories.length === 0
        ) {
          return `<div class="container text-center py-5"><h3>Kategori Tiket Kosong</h3><button onclick="showPage('catalog')" class="btn btn-primary mt-3 rounded-pill">Kembali</button></div>`;
        }
        currentSelectedEvent = event;
        setTimeout(calculateTotal, 50);
        return `
            <div class="container" style="max-width: 700px;">
                <button onclick="showPage('detail', '${event.id_event}')" class="btn btn-link text-decoration-none mb-3 p-0"><i class="bi bi-arrow-left me-1"></i> Kembali</button>
                <div class="card shadow-sm rounded-4 p-4 p-md-5">
                    <h2 class="fw-bold mb-4">Form Checkout & Pembayaran</h2>
                    <form onsubmit="processPayment(event, '${event.id_event}')">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Pilih Kategori Tiket</label>
                            <select id="ticketCategorySelect" class="form-select rounded-pill px-3 py-2" onchange="calculateTotal()">
                                ${event.ticketCategories.map((cat, idx) => `<option value="${cat.id_ticket}" data-index="${idx}" ${cat.kuota <= 0 ? "disabled" : ""}>${cat.nama_ticket} — Rp ${cat.harga.toLocaleString()} (Sisa:${cat.kuota})</option>`).join("")}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Jumlah Tiket</label>
                            <input type="number" id="ticketQuantity" class="form-control rounded-pill px-3" value="1" min="1" oninput="calculateTotal()">
                        </div>

                        <!-- Fitur Metode Pembayaran -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Metode Pembayaran</label>
                            <div class="row g-2">
                                <div class="col-6">
                                    <input type="radio" class="btn-check" name="paymentMethodOption" id="payQRIS" value="QRIS Instan" checked onchange="togglePaymentNotice()">
                                    <label class="btn btn-outline-primary w-100 rounded-3 text-start py-2" for="payQRIS">
                                      <i class="bi bi-qr-code-scan me-2"></i>QRIS Instan
                                    </label>
                                </div>
                                <div class="col-6">
                                    <input type="radio" class="btn-check" name="paymentMethodOption" id="payBCA" value="Transfer BCA" onchange="togglePaymentNotice()">
                                    <label class="btn btn-outline-primary w-100 rounded-3 text-start py-2" for="payBCA">
                                      <i class="bi bi-bank me-2"></i>Bank BCA
                                    </label>
                                </div>
                                <div class="col-6">
                                    <input type="radio" class="btn-check" name="paymentMethodOption" id="payMandiri" value="Transfer Mandiri" onchange="togglePaymentNotice()">
                                    <label class="btn btn-outline-primary w-100 rounded-3 text-start py-2" for="payMandiri">
                                      <i class="bi bi-bank2 me-2"></i>Bank Mandiri
                                    </label>
                                </div>
                                <div class="col-6">
                                    <input type="radio" class="btn-check" name="paymentMethodOption" id="payEWallet" value="E-Wallet (GoPay/OVO)" onchange="togglePaymentNotice()">
                                    <label class="btn btn-outline-primary w-100 rounded-3 text-start py-2" for="payEWallet">
                                      <i class="bi bi-wallet2 me-2"></i>E-Wallet
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div id="paymentInfoBox" class="alert alert-info rounded-4 small mb-4">
                          <i class="bi bi-info-circle-fill me-1"></i> QRIS akan langsung diterbitkan otomatis setelah konfirmasi bayar.
                        </div>

                        <div class="p-3 bg-light rounded-4 mb-4 d-flex justify-content-between align-items-center">
                            <div><span class="text-muted small">Total Pembayaran</span><h4 class="fw-bold text-primary mb-0" id="totalPriceDisplay">Rp 0</h4></div>
                        </div>
                        <button type="submit" id="paySubmitBtn" class="btn btn-primary w-100 py-3 rounded-pill fw-bold shadow-sm">Bayar Sekarang & Terbitkan E-Ticket</button>
                    </form>
                </div>
            </div>`;
      }

      function togglePaymentNotice() {
        const selected =
          document.querySelector('input[name="paymentMethodOption"]:checked')
            ?.value || "";
        const box = document.getElementById("paymentInfoBox");
        if (!box) return;
        if (selected.includes("BCA")) {
          box.innerHTML = `<i class="bi bi-bank me-1"></i> Transfer ke Rekening BCA: <strong>8830-1234-5678</strong> a/n Eventify Platform.`;
        } else if (selected.includes("Mandiri")) {
          box.innerHTML = `<i class="bi bi-bank2 me-1"></i> Transfer ke Mandiri: <strong>137-000-9988-776</strong> a/n Eventify Platform.`;
        } else if (selected.includes("E-Wallet")) {
          box.innerHTML = `<i class="bi bi-wallet2 me-1"></i> Pembayaran E-Wallet via nomor HP: <strong>0812-3456-7890</strong> (GoPay/OVO/ShopeePay).`;
        } else {
          box.innerHTML = `<i class="bi bi-qr-code-scan me-1"></i> Pembayaran QRIS instan bebas biaya admin.`;
        }
      }

      function calculateTotal() {
        const select = document.getElementById("ticketCategorySelect");
        const qtyInput = document.getElementById("ticketQuantity");
        if (!select || !qtyInput || !currentSelectedEvent) return;
        const cat =
          currentSelectedEvent.ticketCategories[
            select.options[select.selectedIndex].dataset.index
          ];
        qtyInput.max = cat.kuota;
        let qty = parseInt(qtyInput.value) || 1;
        if (qty > cat.kuota) qty = cat.kuota;
        if (qty < 1) qty = 1;
        qtyInput.value = qty;
        document.getElementById("totalPriceDisplay").innerText =
          `Rp ${(cat.harga * qty).toLocaleString()}`;
      }

      async function processPayment(e, eventId) {
        e.preventDefault();
        const btn = document.getElementById("paySubmitBtn");
        btn.innerText = "Memproses Pembayaran...";
        btn.disabled = true;

        const event = events.find((ev) => ev.id_event === eventId);
        const select = document.getElementById("ticketCategorySelect");
        const cat =
          event.ticketCategories[
            select.options[select.selectedIndex].dataset.index
          ];
        const qty = parseInt(document.getElementById("ticketQuantity").value);
        const total = cat.harga * qty;
        const paymentMethod =
          document.querySelector('input[name="paymentMethodOption"]:checked')
            ?.value || "Transfer Bank";
        const orderId = "ORD-" + Date.now();

        try {
          let response = await fetch(SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify({
              action: "create_order",
              id_pesanan: orderId,
              id_ticket: cat.id_ticket,
              nama_pemesan: currentUser.name,
              email: currentUser.email,
              no_hp: currentUser.phone,
              jumlah: qty,
              total_harga: total,
              status: "SUCCESS",
            }),
          });
          let res = await response.json();
          if (res.status !== "success") {
            console.warn("Respon server:", res.message);
          }
        } catch (err) {
          console.error(
            "Kesalahan jaringan, menyimpan data secara lokal:",
            err,
          );
        }

        cat.kuota -= qty;
        const newOrder = {
          id_pesanan: orderId,
          id_ticket: cat.id_ticket,
          nama_pemesan: currentUser.name,
          email: currentUser.email,
          no_hp: currentUser.phone,
          jumlah: qty,
          total_harga: total,
          tanggal_pesan: new Date().toISOString().split("T")[0],
          status: "SUCCESS",
          eventTitle: event.nama_event,
          buyerUsername: currentUser.username,
          categoryName: cat.nama_ticket,
          paymentMethod: paymentMethod,
          qrCodeString: "TICKET-" + orderId,
        };

        orders.unshift(newOrder);
        localStorage.setItem("eventify_orders", JSON.stringify(orders));
        renderETicket(newOrder);
      }

      function renderETicket(order) {
        document.getElementById("app").innerHTML = `
            <div class="container text-center" style="max-width: 600px;">
                <div class="card shadow border-0 p-4 p-md-5 rounded-4">
                    <div class="text-success display-1 mb-2"><i class="bi bi-check-circle-fill"></i></div>
                    <h2 class="fw-bold text-success">Pembayaran Berhasil!</h2>
                    <p class="text-muted">E-Ticket berhasil diterbitkan.</p>
                    <div class="p-4 bg-light rounded-4 my-3 text-start">
                        <h5 class="fw-bold text-dark text-center mb-3">${order.eventTitle}</h5>
                        <p class="small mb-1"><strong>Pemesan:</strong> ${order.nama_pemesan}</p>
                        <p class="small mb-1"><strong>Metode Bayar:</strong> ${order.paymentMethod}</p>
                        <p class="small mb-1"><strong>Kategori:</strong> ${order.categoryName} (${order.jumlah} Tiket)</p>
                        <p class="small mb-1"><strong>Total:</strong> Rp ${order.total_harga.toLocaleString()}</p>
                        <div class="text-center bg-white p-3 rounded-3 shadow-sm mt-3">
                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${order.qrCodeString}" alt="QR Tiket" class="img-fluid">
                            <p class="small text-muted font-monospace mt-2 mb-0">${order.qrCodeString}</p>
                        </div>
                    </div>
                    <button onclick="showPage('history')" class="btn btn-outline-primary rounded-pill px-4 py-2 fw-semibold">Lihat Riwayat Pesanan</button>
                </div>
            </div>`;
      }

      function renderOrderHistory() {
        if (!currentUser)
          return `<div class="container text-center py-5"><p>Silakan login terlebih dahulu.</p></div>`;

        const myOrders = orders.filter(
          (o) =>
            o.buyerUsername &&
            o.buyerUsername.toLowerCase() ===
              currentUser.username.toLowerCase(),
        );

        return `
            <div class="container" style="max-width: 800px;">
                <h2 class="fw-bold mb-4">Riwayat Pesanan Saya</h2>
                ${
                  myOrders.length === 0
                    ? `<div class="card shadow-sm rounded-4 p-5 text-center"><p class="text-muted">Belum ada pesanan.</p></div>`
                    : `
                    <div class="d-flex flex-column gap-4">
                        ${myOrders
                          .map(
                            (o) => `
                            <div class="card shadow-sm rounded-4 p-4">
                                <div class="row align-items-center">
                                    <div class="col-md-8">
                                        <h4 class="fw-bold mb-1">${o.eventTitle}</h4>
                                        <small class="text-muted d-block mb-3">ID: ${o.id_pesanan} | Tanggal: ${o.tanggal_pesan}</small>
                                        <p class="small mb-1">Kategori: <strong>${o.categoryName}</strong> (${o.jumlah} Tiket)</p>
                                        <p class="small mb-1">Pembayaran: <strong>${o.paymentMethod || "Transfer Bank"}</strong></p>
                                        <p class="small mb-0">Total: <strong class="text-primary fs-5">Rp ${o.total_harga.toLocaleString()}</strong></p>
                                    </div>
                                    <div class="col-md-4 text-center mt-3 mt-md-0 border-start ps-md-4">
                                        <div class="bg-white p-2 rounded-3 shadow-sm d-inline-block">
                                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=${o.qrCodeString || "TICKET-" + o.id_pesanan}" alt="QR Tiket" style="width: 120px; height: 120px;">
                                        </div>
                                        <small class="d-block text-muted font-monospace mt-1" style="font-size: 0.75rem;">${o.qrCodeString || "TICKET-" + o.id_pesanan}</small>
                                    </div>
                                </div>
                            </div>`,
                          )
                          .join("")}
                    </div>`
                }
            </div>`;
      }
    </script>
  </body>
</html>
